<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400" role="img" aria-labelledby="t d" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Architecture: five stages with a human gate and feedback loop</title><desc id="d">Animated pipeline. Signals flow through data sources, data quality, risk assessment and decision support, then pause at a human gate until an engineer approves. Approved actions go to a technician, and outcomes feed back to tune rules and models. A security layer wraps the data stages.</desc>
<style>.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}.b{font-weight:700}.w6{font-weight:600}</style>
<defs></defs>
<rect x="0" y="0" width="1000" height="400" rx="16" fill="#0f1420" stroke="#2a3447" stroke-width="1"/><text x="37" y="36" font-size="16" fill="#e8ecf4" class="b">How a signal becomes a decision</text><circle cx="640" cy="31" r="5" fill="#6ea0ff"/><text x="651" y="35" font-size="11" fill="#93a0b8">signal</text><circle cx="710" cy="31" r="5" fill="#ffb454"/><text x="721" y="35" font-size="11" fill="#93a0b8">awaiting engineer</text><circle cx="846" cy="31" r="5" fill="#4fd1a1"/><text x="857" y="35" font-size="11" fill="#93a0b8">approved</text><path d="M45,130 H963" stroke="#2a3447" stroke-width="2"/><rect x="37" y="70" width="140" height="120" rx="12" fill="#18202e" stroke="#2a3447" stroke-width="1"/><circle cx="57" cy="92" r="10" fill="#6ea0ff"/><text x="57" y="96" font-size="11.5" fill="#0b1020" text-anchor="middle" class="b">1</text><text x="75" y="96" font-size="12.5" fill="#e8ecf4" class="b">Data sources</text><text x="51" y="126" font-size="11.5" fill="#93a0b8">Sensored assets</text><text x="51" y="146" font-size="11.5" fill="#93a0b8">Work orders</text><text x="51" y="166" font-size="11.5" fill="#93a0b8">Shift logs, notes</text><rect x="203" y="70" width="140" height="120" rx="12" fill="#18202e" stroke="#2a3447" stroke-width="1"/><circle cx="223" cy="92" r="10" fill="#6ea0ff"/><text x="223" y="96" font-size="11.5" fill="#0b1020" text-anchor="middle" class="b">2</text><text x="241" y="96" font-size="12.5" fill="#e8ecf4" class="b">Data quality</text><text x="217" y="126" font-size="11.5" fill="#93a0b8">Audit sensor health</text><text x="217" y="146" font-size="11.5" fill="#93a0b8">Align IDs and time</text><text x="217" y="166" font-size="11.5" fill="#93a0b8">Tag confidence</text><rect x="369" y="70" width="140" height="120" rx="12" fill="#18202e" stroke="#2a3447" stroke-width="1"/><circle cx="389" cy="92" r="10" fill="#6ea0ff"/><text x="389" y="96" font-size="11.5" fill="#0b1020" text-anchor="middle" class="b">3</text><text x="407" y="96" font-size="12.5" fill="#e8ecf4" class="b">Risk assessment</text><text x="383" y="126" font-size="11.5" fill="#93a0b8">Rules first</text><text x="383" y="146" font-size="11.5" fill="#93a0b8">Anomaly detection</text><text x="383" y="166" font-size="11.5" fill="#93a0b8">ML if data supports</text><rect x="535" y="70" width="140" height="120" rx="12" fill="#18202e" stroke="#2a3447" stroke-width="1"/><circle cx="555" cy="92" r="10" fill="#6ea0ff"/><text x="555" y="96" font-size="11.5" fill="#0b1020" text-anchor="middle" class="b">4</text><text x="573" y="96" font-size="12.5" fill="#e8ecf4" class="b">Decision support</text><text x="549" y="126" font-size="11.5" fill="#93a0b8">Risk, reason,</text><text x="549" y="146" font-size="11.5" fill="#93a0b8">confidence</text><text x="549" y="166" font-size="11.5" fill="#93a0b8">Ranked by criticality</text><rect x="823" y="70" width="140" height="120" rx="12" fill="#18202e" stroke="#2a3447" stroke-width="1"/><circle cx="843" cy="92" r="10" fill="#6ea0ff"/><text x="843" y="96" font-size="11.5" fill="#0b1020" text-anchor="middle" class="b">5</text><text x="861" y="96" font-size="12.5" fill="#e8ecf4" class="b">Act and learn</text><text x="837" y="126" font-size="11.5" fill="#93a0b8">Technician inspects</text><text x="837" y="146" font-size="11.5" fill="#93a0b8">Logs the outcome</text><text x="837" y="166" font-size="11.5" fill="#93a0b8">Tunes rules, models</text><rect x="37" y="70" width="140" height="120" rx="12" fill="#6ea0ff" fill-opacity=".10" stroke="#6ea0ff" stroke-width="1.5" opacity="0"><animate attributeName="opacity" calcMode="discrete" dur="10s" repeatCount="indefinite" keyTimes="0.00000;0.10000;0.50000;0.60000;1.00000" values="1;0;1;0;0"/></rect><rect x="203" y="70" width="140" height="120" rx="12" fill="#6ea0ff" fill-opacity=".10" stroke="#6ea0ff" stroke-width="1.5" opacity="0"><animate attributeName="opacity" calcMode="discrete" dur="10s" repeatCount="indefinite" keyTimes="0.00000;0.11000;0.21500;0.61000;0.71500;1.00000" values="0;1;0;1;0;0"/></rect><rect x="369" y="70" width="140" height="120" rx="12" fill="#6ea0ff" fill-opacity=".10" stroke="#6ea0ff" stroke-width="1.5" opacity="0"><animate attributeName="opacity" calcMode="discrete" dur="10s" repeatCount="indefinite" keyTimes="0.00000;0.22000;0.32500;0.46000;0.50000;0.72000;0.82500;0.96000;1.00000" values="0;1;0;1;0;1;0;1;1"/></rect><rect x="535" y="70" width="140" height="120" rx="12" fill="#6ea0ff" fill-opacity=".10" stroke="#6ea0ff" stroke-width="1.5" opacity="0"><animate attributeName="opacity" calcMode="discrete" dur="10s" repeatCount="indefinite" keyTimes="0.00000;0.33500;0.44000;0.83500;0.94000;1.00000" values="0;1;0;1;0;0"/></rect><rect x="823" y="70" width="140" height="120" rx="12" fill="#6ea0ff" fill-opacity=".10" stroke="#6ea0ff" stroke-width="1.5" opacity="0"><animate attributeName="opacity" calcMode="discrete" dur="10s" repeatCount="indefinite" keyTimes="0.00000;0.15000;0.24000;0.65000;0.74000;1.00000" values="0;1;0;1;0;0"/></rect><text x="749" y="58" font-size="11.5" fill="#ffb454" text-anchor="middle" class="b">Human gate</text><path d="M749,80 L797,130 L749,180 L701,130 Z" fill="#18202e" stroke="#ffb454" stroke-width="2"><animate attributeName="stroke-opacity" values="1;.35;1" dur="2s" repeatCount="indefinite"/></path><text x="749" y="128" font-size="11.5" fill="#e8ecf4" text-anchor="middle" class="b">Engineer</text><text x="749" y="143" font-size="11.5" fill="#e8ecf4" text-anchor="middle" class="b">approves?</text><path d="M749,180 V250" stroke="#93a0b8" stroke-width="1.5" stroke-dasharray="4 4"/><text x="757" y="224" font-size="10.5" fill="#93a0b8" class="m">dismissed, logged</text><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#93a0b8"/></marker></defs><path d="M893,190 V250 H439 V196" fill="none" stroke="#93a0b8" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ar)"><animate attributeName="stroke-dashoffset" values="18;0" dur="1.2s" repeatCount="indefinite"/></path><text x="666" y="272" font-size="11" fill="#93a0b8" text-anchor="middle">feedback: confirmed · false alarm · missed → tunes thresholds</text><text x="741" y="204" font-size="11" fill="#ffb454" text-anchor="end" class="m" opacity="0">awaiting approval…<animate attributeName="opacity" calcMode="discrete" dur="10s" repeatCount="indefinite" keyTimes="0.00000;0.12000;0.45000;0.62000;0.95000;1.00000" values="1;0;1;0;1;1"/></text><rect x="37" y="300" width="926" height="46" rx="10" fill="none" stroke="#6ea0ff" stroke-width="1.2" stroke-dasharray="6 5"/><path d="M107,190 V300" stroke="#6ea0ff" stroke-width="1.5" stroke-dasharray="2 4"><animate attributeName="stroke-dashoffset" values="12;0" dur="1.4s" repeatCount="indefinite"/></path><path d="M399,190 V300" stroke="#6ea0ff" stroke-width="1.5" stroke-dasharray="2 4"><animate attributeName="stroke-dashoffset" values="12;0" dur="1.4s" repeatCount="indefinite"/></path><g transform="translate(58,314)"><rect x="0" y="7" width="16" height="12" rx="2" fill="#6ea0ff"/><path d="M3,7 V4 a5,5 0 0 1 10,0 V7" fill="none" stroke="#6ea0ff" stroke-width="2"/></g><text x="86" y="328" font-size="12.5" fill="#93a0b8"><tspan fill="#e8ecf4" font-weight="700">Security layer</tspan>   access control · IT/OT security · selective FHE (compute-heavy, so used only where it earns its cost)</text><text x="500" y="376" font-size="12.5" fill="#4fd1a1" text-anchor="middle" class="w6">No auto-shutdown. No set-point changes. Engineers approve every action in the pilot.</text><g><circle r="7" fill="#6ea0ff" opacity=".35"><animate attributeName="r" values="7;11;7" dur="1s" repeatCount="indefinite"/></circle><circle r="5" fill="#6ea0ff"><animate attributeName="fill" calcMode="discrete" dur="10s" begin="0s" repeatCount="indefinite" keyTimes="0;0.45;0.62;1" values="#6ea0ff;#ffb454;#4fd1a1;#4fd1a1"/></circle><animateMotion dur="10s" begin="0s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0.446;0.446;1" keyTimes="0;0.45;0.62;1" path="M45,130 H893 V250 H439 V190"/></g><g><circle r="7" fill="#6ea0ff" opacity=".35"><animate attributeName="r" values="7;11;7" dur="1s" repeatCount="indefinite"/></circle><circle r="5" fill="#6ea0ff"><animate attributeName="fill" calcMode="discrete" dur="10s" begin="-5s" repeatCount="indefinite" keyTimes="0;0.45;0.62;1" values="#6ea0ff;#ffb454;#4fd1a1;#4fd1a1"/></circle><animateMotion dur="10s" begin="-5s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0.446;0.446;1" keyTimes="0;0.45;0.62;1" path="M45,130 H893 V250 H439 V190"/></g>
</svg>
