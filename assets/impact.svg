<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 350" width="1000" height="350" role="img" aria-labelledby="t d" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Illustrative impact: 1.8 days per year recovered</title><desc id="d">Animated illustration. Six blocks represent six days of lost production; thirty percent turn green to show 1.8 days a year, then a bar shows that is 43.2 hours or about 0.49 percent of 8,760 hours. Marked illustrative and not measured.</desc>
<style>.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}.b{font-weight:700}.w6{font-weight:600}</style>
<defs></defs>
<rect x="0" y="0" width="1000" height="350" rx="16" fill="#0f1420" stroke="#2a3447" stroke-width="1"/><g><text x="40" y="38" font-size="16" fill="#e8ecf4" class="b">What recovered production time could look like</text><rect x="740" y="18" width="220" height="26" rx="13" fill="none" stroke="#ffb454" stroke-width="1"/><text x="850" y="35" font-size="10.5" fill="#ffb454" text-anchor="middle" class="m">ILLUSTRATIVE · NOT MEASURED</text><rect x="40" y="70" width="96" height="64" rx="10" fill="#ff7a70" fill-opacity=".8"/><text x="88" y="108" font-size="12.5" fill="#0b1020" text-anchor="middle" class="b">day 1</text><rect x="146" y="70" width="96" height="64" rx="10" fill="#ff7a70" fill-opacity=".8"/><text x="194" y="108" font-size="12.5" fill="#0b1020" text-anchor="middle" class="b">day 2</text><rect x="252" y="70" width="96" height="64" rx="10" fill="#ff7a70" fill-opacity=".8"/><text x="300" y="108" font-size="12.5" fill="#0b1020" text-anchor="middle" class="b">day 3</text><rect x="358" y="70" width="96" height="64" rx="10" fill="#ff7a70" fill-opacity=".8"/><text x="406" y="108" font-size="12.5" fill="#0b1020" text-anchor="middle" class="b">day 4</text><rect x="464" y="70" width="96" height="64" rx="10" fill="#ff7a70" fill-opacity=".8"/><text x="512" y="108" font-size="12.5" fill="#0b1020" text-anchor="middle" class="b">day 5</text><rect x="570" y="70" width="96" height="64" rx="10" fill="#ff7a70" fill-opacity=".8"/><text x="618" y="108" font-size="12.5" fill="#0b1020" text-anchor="middle" class="b">day 6</text><rect x="40" y="70" width="0" height="64" rx="10" fill="#4fd1a1"><animate attributeName="width" calcMode="linear" dur="12s" repeatCount="indefinite" keyTimes="0.00000;0.16667;0.26667;0.94167;0.94250;1.00000" values="0;0;96;96;0;0"/></rect><rect x="146" y="70" width="0" height="64" rx="10" fill="#4fd1a1"><animate attributeName="width" calcMode="linear" dur="12s" repeatCount="indefinite" keyTimes="0.00000;0.26667;0.36667;0.94167;0.94250;1.00000" values="0;0;76.8;76.8;0;0"/></rect><text x="40" y="156" font-size="12" fill="#93a0b8">6 days of lost production in the brief</text><text x="40" y="174" font-size="12" fill="#4fd1a1">about 30% prevented by earlier detection (assumed)</text><text x="720" y="122" font-size="46" font-weight="800" fill="#4fd1a1" opacity="0">0.0<animate attributeName="opacity" calcMode="discrete" dur="12s" repeatCount="indefinite" keyTimes="0.00000;0.16667;0.95000;1.00000" values="1;0;1;1"/></text><text x="720" y="122" font-size="46" font-weight="800" fill="#4fd1a1" opacity="0">0.3<animate attributeName="opacity" calcMode="discrete" dur="12s" repeatCount="indefinite" keyTimes="0.00000;0.20417;0.24167;1.00000" values="0;1;0;0"/></text><text x="720" y="122" font-size="46" font-weight="800" fill="#4fd1a1" opacity="0">0.6<animate attributeName="opacity" calcMode="discrete" dur="12s" repeatCount="indefinite" keyTimes="0.00000;0.24167;0.27917;1.00000" values="0;1;0;0"/></text><text x="720" y="122" font-size="46" font-weight="800" fill="#4fd1a1" opacity="0">0.9<animate attributeName="opacity" calcMode="discrete" dur="12s" repeatCount="indefinite" keyTimes="0.00000;0.27917;0.31667;1.00000" values="0;1;0;0"/></text><text x="720" y="122" font-size="46" font-weight="800" fill="#4fd1a1" opacity="0">1.2<animate attributeName="opacity" calcMode="discrete" dur="12s" repeatCount="indefinite" keyTimes="0.00000;0.31667;0.35417;1.00000" values="0;1;0;0"/></text><text x="720" y="122" font-size="46" font-weight="800" fill="#4fd1a1" opacity="0">1.5<animate attributeName="opacity" calcMode="discrete" dur="12s" repeatCount="indefinite" keyTimes="0.00000;0.35417;0.39167;1.00000" values="0;1;0;0"/></text><text x="720" y="122" font-size="46" font-weight="800" fill="#4fd1a1" opacity="0">1.8<animate attributeName="opacity" calcMode="discrete" dur="12s" repeatCount="indefinite" keyTimes="0.00000;0.39167;0.95000;1.00000" values="0;1;0;0"/></text><text x="820" y="122" font-size="16" fill="#e8ecf4" class="w6">days / yr</text><text x="720" y="146" font-size="12" fill="#93a0b8">6 days × 30% prevented</text><text x="720" y="164" font-size="12" fill="#93a0b8">an assumption, not a measurement</text><text x="40" y="218" font-size="14" fill="#e8ecf4" class="w6" >In hours:  1.8 × 24 h = 43.2 h</text><rect x="40" y="234" width="920" height="14" rx="7" fill="#1d2738" stroke="#2a3447" stroke-width="1"/><rect x="40" y="234" width="0" height="14" rx="3" fill="#4fd1a1"><animate attributeName="width" calcMode="linear" dur="12s" repeatCount="indefinite" keyTimes="0.00000;0.41667;0.50000;0.94167;0.94250;1.00000" values="0;0;4.5;4.5;0;0"/></rect><text x="60" y="270" font-size="11.5" fill="#93a0b8">↑ 43.2 h ≈ 0.49% of 8,760 calendar hours (365 × 24). The brief does not define “days”.</text><text x="960" y="218" font-size="11.5" fill="#93a0b8" text-anchor="end" class="m">8,760 h in a year</text><rect x="40" y="290" width="920" height="40" rx="10" fill="#18202e" stroke="#2a3447" stroke-width="1"/><text x="56" y="315" font-size="12" fill="#93a0b8"><tspan fill="#e8ecf4" font-weight="700">net benefit</tspan> = prevented days × value per day (+ verified repair costs) − running costs   ·   <tspan fill="#e8ecf4" font-weight="700">payback</tspan> = ₹2 cr ÷ net benefit</text><animate attributeName="opacity" calcMode="linear" dur="12s" repeatCount="indefinite" keyTimes="0.00000;0.90833;0.93333;0.95833;0.98333;1.00000" values="1;1;0;0;1;1"/></g>
</svg>
